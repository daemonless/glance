# Starter dashboard. Edit /config/glance.yml; widget reference:
# https://github.com/glanceapp/glance/blob/main/docs/configuration.md
pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Daemonless
                links:
                  - title: daemonless.io
                    url: https://daemonless.io
                  - title: Image Catalog
                    url: https://daemonless.io/images/
                  - title: GitHub
                    url: https://github.com/daemonless
                  - title: Discord
                    url: https://discord.gg/Kb9tkhecZT
              - title: FreeBSD
                links:
                  - title: FreeBSD Handbook
                    url: https://docs.freebsd.org/en/books/handbook/
                  - title: FreshPorts
                    url: https://www.freshports.org/
                  - title: Security Advisories
                    url: https://www.freebsd.org/security/advisories/
                  - title: Bugzilla
                    url: https://bugs.freebsd.org/
              - title: Glance
                links:
                  - title: Configuration docs
                    url: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
                  - title: Themes
                    url: https://github.com/glanceapp/glance/blob/main/docs/themes.md

          - type: calendar
            first-day-of-week: monday

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo

          - type: rss
            limit: 10
            collapse-after: 5
            cache: 12h
            feeds:
              - url: https://www.freebsd.org/news/rss.xml
                title: FreeBSD News
              - url: https://freebsdfoundation.org/feed/
                title: FreeBSD Foundation
              - url: https://selfh.st/rss/
                title: selfh.st

          # More widgets to try (each needs network access from the container):
